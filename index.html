        // --- SPEECH SYNTHESIS (VOICE) ---
        let availableVoices = [];
        window.speechSynthesis.onvoiceschanged = () => availableVoices = window.speechSynthesis.getVoices();

        function getBestVoice() {
            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
            
            // 1. Prioritise premium Australian English Online "Natural" voices (Your perfect voice profile)
            let auVoice = availableVoices.find(v => v.lang === 'en-AU' && v.name.includes('Natural')) || 
                          availableVoices.find(v => v.lang === 'en-AU' && v.name.includes('Online')) ||
                          availableVoices.find(v => v.lang === 'en-AU' && v.name.includes('Google')) ||
                          availableVoices.find(v => v.lang === 'en-AU');
            if (auVoice) return auVoice;

            // 2. Prioritise US English Online "Natural" voices (Explicitly avoid British UK en-GB)
            let usVoice = availableVoices.find(v => v.lang === 'en-US' && v.name.includes('Natural')) || 
                          availableVoices.find(v => v.lang === 'en-US' && v.name.includes('Online')) ||
                          availableVoices.find(v => v.lang === 'en-US' && v.name.includes('Google')) ||
                          availableVoices.find(v => v.lang === 'en-US');
            if (usVoice) return usVoice;

            // 3. Fallback: Any English accent EXCEPT British (en-GB)
            let nonBritishVoice = availableVoices.find(v => v.lang.startsWith('en') && !v.lang.includes('GB'));
            if (nonBritishVoice) return nonBritishVoice;

            return availableVoices[0];
        }

        function speak(text) {
            return new Promise((resolve) => {
                isSpeaking = true;
                
                // Temporarily abort recognition so synthesis doesn't loop back into speech input
                try {
                    if (recognition) {
                        recognition.abort();
                    }
                } catch(e) {}

                responseText.textContent = text;
                responseText.classList.add('visible');

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.voice = getBestVoice();
                utterance.pitch = 1.0;
                utterance.rate = 1.0; 

                // Failsafe timeout to prevent Chrome TTS engine locks
                const speakTimeout = setTimeout(() => {
                    console.log("Failsafe triggered: Speech Synthesis forced release.");
                    window.speechSynthesis.cancel();
                    isSpeaking = false;
                    restartRecognition();
                    resolve();
                }, 10000); 

                utterance.onend = () => {
                    clearTimeout(speakTimeout);
                    isSpeaking = false;
                    setTimeout(() => { if (!isSpeaking) responseText.classList.remove('visible'); }, 3000);
                    restartRecognition();
                    resolve();
                };

                utterance.onerror = () => { 
                    clearTimeout(speakTimeout);
                    isSpeaking = false; 
                    restartRecognition();
                    resolve(); 
                };
                
                window.speechSynthesis.speak(utterance);
            });
        }

        // --- SPOKEN WORDS TO MATH DIGITS CONVERTER ---
        function convertSpokenNumbers(text) {
            const units = {
                'zero': 0, 'one': 1, 'two': 2, 'three': 3, 'four': 4, 'five': 5, 'six': 6, 'seven': 7, 'eight': 8, 'nine': 9,
                'ten': 10, 'eleven': 11, 'twelve': 12, 'thirteen': 13, 'fourteen': 14, 'fifteen': 15, 'sixteen': 16,
                'seventeen': 17, 'eighteen': 18, 'nineteen': 19
            };
            const tens = {
                'twenty': 20, 'thirty': 30, 'forty': 40, 'fifty': 50, 'sixty': 60, 'seventy': 70, 'eighty': 80, 'ninety': 90
            };

            let result = text;
            
            for (let t in tens) {
                for (let u in units) {
                    if (u !== 'zero') {
                        const regex1 = new RegExp(`\\b${t}\\s+${u}\\b`, 'gi');
                        const regex2 = new RegExp(`\\b${t}-${u}\\b`, 'gi');
                        const mathSum = parseInt(tens[t]) + parseInt(units[u]);
                        result = result.replace(regex1, mathSum);
                        result = result.replace(regex2, mathSum);
                    }
                }
            }
            
            for (let t in tens) {
                const regex = new RegExp(`\\b${t}\\b`, 'gi');
                result = result.replace(regex, tens[t]);
            }
            
            for (let u in units) {
                const regex = new RegExp(`\\b${u}\\b`, 'gi');
                result = result.replace(regex, units[u]);
            }
            
            return result;
        }

        // --- GEMINI 3.1 FLASH-LITE API CLIENT ---
        async function callGemini(userPrompt) {
            if (!geminiApiKey) return null;

            const systemPrompt = `You are Leo, a highly intelligent voice-enabled desktop assistant.
Your job is to parse the user's spoken command and generate a structured JSON action to control the user's web browser and PC.

Available Actions:
1. {"action": "speak", "param": "spoken text response"}
   Use this for answers to general questions, calculations, facts, jokes, text manipulation, cryptology base64 tasks, passwords, unit conversions, coin flipping, dice rolling, translations, etc.
2. {"action": "open_app", "app": "app_name", "speak": "the speech confirmation"}
   Valid apps: steam, discord, vscode, spotify, epic games, calculator, clock, word, excel, powerpoint, whatsapp, telegram, zoom, slack, netflix, settings, paint, camera, maps, weather app, roblox.
3. {"action": "open_web", "site": "site_name", "speak": "the speech confirmation"}
   Valid sites: youtube, twitter, instagram, github, reddit, tiktok. Or a generic URL starting with http/https.
4. {"action": "google_search", "query": "search query", "speak": "the speech confirmation"}
   Performs a Google Search.
5. {"action": "youtube_play", "query": "video description", "speak": "the speech confirmation"}
   Plays a video/query on YouTube.
6. {"action": "email_draft", "recipient": "name/email", "subject": "subject line", "body": "email contents", "speak": "the speech confirmation"}
   Opens an Outlook email compose tab.
7. {"action": "weather_check", "city": "city name", "speak": "the speech confirmation"}
   Queries Melbourne or another city's weather.
8. {"action": "calendar_reminder", "task": "reminder text", "speak": "the speech confirmation"}
   Opens Google Calendar to schedule.
9. {"action": "roblox_launch", "game": "game name", "speak": "the speech confirmation"}
   Launches a specific game in Roblox.

Guidelines:
- Return strictly raw JSON. Do NOT wrap in code block characters like \`\`\`json.
- Maintain a helpful, friendly Australian-accent friendly persona. Keep speech confirmation brief and easy to understand when read aloud.
- Use the "speak" action for general chatter, arithmetic, translation, or questions.

User Request: "${userPrompt}"`;

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${geminiApiKey}`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: systemPrompt
                            }]
                        }],
                        generationConfig: {
                            responseMimeType: "application/json"
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`Gemini API Error: ${response.status}`);
                }

                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text.trim();
                
                let cleanedJson = jsonText;
                if (cleanedJson.startsWith("```json")) {
                    cleanedJson = cleanedJson.replace(/^```json/, "");
                }
                if (cleanedJson.endsWith("```")) {
                    cleanedJson = cleanedJson.slice(0, -3);
                }
                cleanedJson = cleanedJson.trim();

                return JSON.parse(cleanedJson);
            } catch (e) {
                console.error("Gemini invocation failed:", e);
                return null;

        async function executeGeminiAction(result) {
            if (!result || !result.action) {
                await speak("I couldn't process that command.");
                return;
            }

            const speakText = result.speak || result.param || "";
            const action = result.action.toLowerCase();

            switch (action) {
                case 'speak':
                    const textToSay = result.param || result.text || result.speak || "";
                    if (textToSay) {
                        await speak(textToSay);
                    }
                    break;

                case 'open_app':
                    const app = (result.app || result.param || "").toLowerCase();
                    if (appProtocols[app]) {
                        if (speakText) await speak(speakText);
                        window.location.href = appProtocols[app];
                    } else {
                        await speak(`I don't know the app protocol for ${app}.`);
                    }
                    break;

                case 'open_web':
                    const site = (result.site || result.param || result.url || "");

                        'twitter': 'https://www.twitter.com',
                        'instagram': 'https://www.instagram.com',
                        'github': 'https://www.github.com',
                        'reddit': 'https://www.reddit.com',
                        'tiktok': 'https://www.tiktok.com'
                    };
                    let targetUrl = allowedWebsites[site.toLowerCase()];
                    if (!targetUrl && (site.startsWith('http://') || site.startsWith('https://'))) {
                        targetUrl = site;
                    }
                    if (targetUrl) {
                        if (speakText) await speak(speakText);
                        window.open(targetUrl, '_blank');
                    } else {
                        await speak(`I am only allowed to open certain websites, or valid URLs.`);
                    }
                    break;

                case 'google_search':
                    const query = result.query || result.param || "";
                    if (query) {
                        if (speakText) await speak(speakText);
                        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                    }
                    break;

                case 'youtube_play':

                    if (ytQuery) {
                        if (speakText) await speak(speakText);
                        window.open(`https://duckduckgo.com/?q=!yt+${encodeURIComponent(ytQuery)}`, '_blank');

                    break;

                case 'email_draft':

                    const subject = result.subject || "New Draft";

                    const toField = recipient.includes('@') ? recipient : "";
                    const finalBody = recipient && !recipient.includes('@')

                    if (speakText) await speak(speakText);

                    break;

                case 'weather_check':
                    const city = result.city || result.param || "Melbourne";

                        if (speakText) await speak(speakText);
                        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
                        const geoData = await geoRes.json();
                        if (!geoData.results) throw new Error("Not found");
                        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geoData.results[0].latitude}&longitude=${geoData.results[0].longitude}&current_weather=true`);
                        const temp = (await weatherRes.json()).current_weather.temperature;

                case 'calendar_reminder':

                        window.open(calendarUrl, '_blank');

                    break;

                case 'roblox_launch':

                    } else {
                        try {
                            const rolimonsRes = await fetch('https://api.rolimons.com/games/v1/gamelist');
                            const rolimonsData = await rolimonsRes.json();
                            let foundPlaceId = null;
                            let actualName = "";

                            if (rolimonsData && rolimonsData.success && rolimonsData.games) {
                                for (const [placeId, gameInfo] of Object.entries(rolimonsData.games)) {
                                    const gameTitle = gameInfo[0].toLowerCase();

        // --- BRAIN & COMMAND LOGIC ---
        async function processCommand(command) {

                isListeningState = false;
                lastFollowUp = null;

            if (lastFollowUp) {

                        ? `Hi ${recipient},\n\n${body}`

            // --- 1. MATH EVALUATION ---

                .replace(/(what is|whats|what's|calculate)/gi, '')
                .replace(/plus/gi, '+')
                .replace(/minus/gi, '-')
                .replace(/(times|multiplied by)/gi, '*')
                .replace(/divided by/gi, '/')
                .replace(/x/gi, '*')

            if (/^[\d\s\+\-\*\/\.\(\)]+$/.test(mathExpr) && /[0-9]/.test(mathExpr)) {

                await speak(`I flipped a coin and it landed on ${result}.`);
            }
            else if (/roll a die|roll a dice|roll die|roll dice/i.test(command)) {
                const result = Math.floor(Math.random() * 6) + 1;
                await speak(`I rolled a six-sided die and got a ${result}.`);
            }

            // --- 16. RANDOM NUMBER GENERATOR ---
            else if (/random number|pick a number|choose a number/i.test(command)) {
                const rangeMatch = command.match(/between\s+(\d+)\s+and\s+(\d+)/i);
                let min = 1, max = 100;
                if (rangeMatch) {
                    min = parseInt(rangeMatch[1]);
                    max = parseInt(rangeMatch[2]);
                }
                const result = Math.floor(Math.random() * (max - min + 1)) + min;
                await speak(`Your random number between ${min} and ${max} is ${result}.`);
            }

            // --- 17. SECURE PASSWORD GENERATOR ---
            else if (/generate a password|secure password|generate password/i.test(command)) {
                const lengthMatch = command.match(/length\s+(\d+)/i) || command.match(/(\d+)\s+characters/i);
                let length = 12;
                if (lengthMatch) {
                    length = parseInt(lengthMatch[1]);
                }
                const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+~`|}{[]:;?><,./-=";
                let password = "";
                for (let i = 0; i < length; i++) {
                    password += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                await speak(`I've generated a secure ${length}-character password for you.`);
                responseText.textContent = `Password: ${password}`;
                responseText.classList.add('visible');
                try {
                    await navigator.clipboard.writeText(password);
                } catch(e) {}
            }

            // --- 18. CRYPTOGRAPHY (BASE64) ---
            else if (/base64/i.test(command)) {
                if (command.includes('encode')) {
                    const str = command.replace(/.*encode\s+/, '').replace(/\s+to\s+base64.*/, '').trim();
                    const encoded = btoa(str);
                    await speak(`Encoded string copied to clipboard.`);
                    responseText.textContent = `Base64: ${encoded}`;
                    responseText.classList.add('visible');
                    try {
                        await navigator.clipboard.writeText(encoded);
                    } catch(e) {}
                } else if (command.includes('decode')) {
                    const str = command.replace(/.*decode\s+/, '').replace(/\s+from\s+base64.*/, '').trim();
                    try {
                        const decoded = atob(str);
                        await speak(`Decoded text is: ${decoded}`);
                    } catch(e) {
                        await speak("I couldn't decode that string. Make sure it's valid base64.");
                    }
                }
            }

            // --- 19. UNIT CONVERTER ---
            else if (/convert\s+(\d+)\s+([a-zA-Z]+)\s+to\s+([a-zA-Z]+)/i.test(command)) {
                const match = command.match(/convert\s+(\d+)\s+([a-zA-Z]+)\s+to\s+([a-zA-Z]+)/i);
                if (match) {
                    const val = parseFloat(match[1]);
                    const from = match[2].toLowerCase();
                    const to = match[3].toLowerCase();
                    let resVal = null;
                    let unitStr = "";

                    if (from === 'celsius' && to === 'fahrenheit') {
                        resVal = (val * 9/5) + 32;
                        unitStr = "Fahrenheit";
                    } else if (from === 'fahrenheit' && to === 'celsius') {
                        resVal = (val - 32) * 5/9;
                        unitStr = "Celsius";
                    }
                    else if (from === 'kilograms' && to === 'pounds') {
                        resVal = val * 2.20462;
                        unitStr = "pounds";
                    } else if (from === 'pounds' && to === 'kilograms') {
                        resVal = val / 2.20462;
                        unitStr = "kilograms";
                    }
                    else if (from === 'kilometers' && to === 'miles') {
                        resVal = val * 0.621371;
                        unitStr = "miles";
                    } else if (from === 'miles' && to === 'kilometers') {
                        resVal = val / 0.621371;
                        unitStr = "kilometers";
                    }

                    if (resVal !== null) {
                        await speak(`${val} ${from} is equivalent to ${resVal.toFixed(2)} ${unitStr}.`);
                    } else {
                        await speak(`I don't support converting ${from} to ${to} natively yet.`);
                    }
                }
            }

            // --- 20. QR CODE GENERATOR ---
            else if (/generate a qr code|qr code for|generate qr/i.test(command)) {
                const match = command.match(/(?:for|qr)\s+(.+)/i);
                if (match) {
                    const qrText = match[1].trim();
                    await speak(`Generating your QR code.`);
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(qrText)}`;
                    window.open(qrUrl, '_blank');
                } else {
                    await speak("What would you like me to make a QR code for?");
                }
            }

            // --- 21. CRYPTO PRICING LOOKUP ---
            else if (/crypto|price of (bitcoin|ethereum|solana|doge|cardano)/i.test(command)) {
                const coinMap = {
                    'bitcoin': 'BTC',
                    'ethereum': 'ETH',
                    'solana': 'SOL',
                    'doge': 'DOGE',
                    'dogecoin': 'DOGE',
                    'cardano': 'ADA'
                };
                let coin = 'BTC';
                const match = command.match(/price of ([a-zA-Z]+)/i);
                if (match && coinMap[match[1].toLowerCase()]) {
                    coin = coinMap[match[1].toLowerCase()];
                }
                try {
                    const res = await fetch(`https://api.coinbase.com/v2/prices/${coin}-USD/spot`);
                    const data = await res.json();
                    if (data && data.data && data.data.amount) {
                        const price = parseFloat(data.data.amount).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
                        await speak(`The price of ${coin} is currently ${price} U.S. dollars.`);
                    } else throw new Error("API error");
                } catch(e) {
                    await speak(`I couldn't fetch the price of ${coin} right now.`);
                }
            }

            // --- 22. DIRECT WIKIPEDIA ---
            else if (/wikipedia/i.test(command)) {
                const query = command.replace(/wikipedia/gi, '').replace(/(search|look up|for)/gi, '').trim();
                if (query) {
                    await speak(`Searching Wikipedia for ${query}.`);
                    window.open(`https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(query)}`, '_blank');
                } else {
                    await speak("What would you like me to lookup on Wikipedia?");
                }
            }

            // --- 23. TRANSLATOR ---
            else if (/translate\s+(.+)\s+to\s+([a-zA-Z]+)/i.test(command)) {
                const match = command.match(/translate\s+(.+)\s+to\s+([a-zA-Z]+)/i);
                if (match) {
                    const textToTranslate = match[1].trim();
                    const targetLang = match[2].trim();
                    await speak(`Opening Google Translate for ${textToTranslate} to ${targetLang}.`);
                    window.open(`https://translate.google.com/?sl=auto&tl=${encodeURIComponent(targetLang)}&text=${encodeURIComponent(textToTranslate)}&op=translate`, '_blank');
                }
            }

            // --- 24. FALLBACK FEEDBACK OR GEMINI ENHANCEMENT ---
            else {
                if (geminiApiKey) {
                    await speak("Thinking...");
                    const geminiResult = await callGemini(command);
                    if (geminiResult) {
                        await executeGeminiAction(geminiResult);
                        isListeningState = false;
                        return;
                    }
                }

                const sorryResponses = [
                    "Sorry, I didn't understand.",
                    "Sorry, I didn't quite get that."
                ];
                await speak(sorryResponses[Math.floor(Math.random() * sorryResponses.length)]);
            }

            isListeningState = false; 
        }

        // --- SPEECH RECOGNITION (Always On) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        function restartRecognition() {
            if (isSpeaking) return; // Don't interrupt spoken feedback
            try {
                recognition.start();
            } catch (e) {
                // Ignore if already running
            }
        }

        function initSpeechRecognition() {
            if (!SpeechRecognition) {
                responseText.textContent = "Voice recognition not supported. Use Chrome or Edge.";
                responseText.classList.add('visible');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false; // Set to false for high reliability/responsiveness
            recognition.interimResults = true; 
            recognition.lang = 'en-AU'; 

            recognition.onstart = () => {
                recognitionActive = true;
            };

            recognition.onresult = (event) => {
                if (isSpeaking) return;

                // Stop interpreting voice inputs if settings menu is open
                if (document.getElementById('settings-modal').style.display === 'flex') {
                    return;
                }

                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }

                const currentText = (finalTranscript || interimTranscript).toLowerCase().trim();
                
                // Explicit direct wake words for high sensitivity
                const directWakeWords = [
                    'hey leo', 'ok leo', 'okay leo', 'hi leo', 'hello leo', 'g\'day leo', 'gday leo', 'yo leo',
                    'hey lio', 'ok lio', 'okay lio', 'hey leeo', 'ok leeo', 'hey cleo', 'ok cleo', 'hey neo', 'ok neo',
                    'hey halo', 'ok halo', 'okay halo'
                ];
                
                const containsDirectWake = directWakeWords.some(phrase => currentText.includes(phrase));

                // Advanced phonetic wake word list targeting "Leo" mishearings (High sensitivity fallback)
                const wakeWordRegex = /(?:hey|ay|hay|hi|gday|g'day|ok|okay|play|say|day)\s+(leo|lio|leeo|leow|liao|layo|neo|cleo|theo|layer|layout|low|law|lead|let|letter|leave|lake|leg|link|learn|look|loop|blue|glow|flow|line|light|list|left|lit|little|live|love|level|lion|liar|lear|learnt|clear|there|dear|darling|level|file|style|while|dial|mile|smile)|^(leo|lio|leeo|lear|g'day|gday|clear)$/i;

                // WAKE WORD HEARD
                if ((containsDirectWake || wakeWordRegex.test(currentText)) && !isListeningState) {
                    isListeningState = true;
                    activationSound.currentTime = 0;
                    activationSound.play().catch(e => console.log("Audio requires interaction first time."));

                    clearTimeout(idleTimeout);
                    idleTimeout = setTimeout(() => {
                        isListeningState = false;
                        lastFollowUp = null;
                    }, 8000); 
                }

                // PROCESS FINISHED SENTENCE
                if (finalTranscript) {
                    let commandText = finalTranscript.toLowerCase();
                    
                    // Remove direct wake words first to avoid command contamination
                    for (const phrase of directWakeWords) {
                        if (commandText.includes(phrase)) {
                            commandText = commandText.replace(phrase, '').trim();
                        }
                    }

                    if (wakeWordRegex.test(commandText)) {
                        commandText = commandText.replace(wakeWordRegex, '').trim();
                    }

                    // Clean up potential leading/trailing punctuation or particles
                    commandText = commandText.replace(/^[,.\s?]+|[,.\s?]+$/g, '').trim();

                    if (isListeningState) {
                        // Filter out short background noises
                        if (commandText.length > 2 && !['uh', 'um', 'ah'].includes(commandText)) {
                            isListeningState = false;
                            clearTimeout(idleTimeout);
                            
                            // 0.4s Delay so it doesn't cut you off mid-breath
                            setTimeout(() => {
                                processCommand(commandText);
                            }, 400);
                        }
                    }
                }
            };

            recognition.onend = () => {
                recognitionActive = false;
                // Auto-restart immediately to simulate continuous capturing without Chromium freezes
                if (!isSpeaking) {
                    restartRecognition();
                }
            };

            // Watchdog Keep-Alive Loop: Resolves flakiness/stalls by forcing restart every 1.5s if silently closed
            setInterval(() => {
                if (!recognitionActive && !isSpeaking && micPermissionGranted) {
                    console.log("Watchdog Keep-Alive: Waking Speech Recognition up.");
                    restartRecognition();
                }
            }, 1500);

            restartRecognition();
        }

        // --- AUTOMATIC INITIALIZATION (ON LOAD) ---
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // Request mic permission to trigger browser authorization, then immediately release lock
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                micPermissionGranted = true;
            } catch (err) {
                responseText.textContent = "Please allow microphone access to use Leo!";
                responseText.classList.add('visible');
                return; 
            }

            siriWave = new SiriWave({
                container: siriContainer,
                width: window.innerWidth,
                height: 300,
                style: 'ios9',
                speed: currentSpeed,
                amplitude: currentAmplitude,
                autostart: true
            });

            window.addEventListener('resize', () => {
                siriContainer.innerHTML = ''; 
                siriWave = new SiriWave({
                    container: siriContainer,
                    width: window.innerWidth,
                    height: 300,
                    style: 'ios9',
                    speed: currentSpeed,
                    amplitude: currentAmplitude,
                    autostart: true
                });
            });

            animateWave();
            initSpeechRecognition();
        });

    </script>
