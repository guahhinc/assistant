<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo Assistant</title>
    
    <!-- Include Inter Tight Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Include the SiriWave Library -->
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter Tight', sans-serif;
            font-weight: 300; /* Set body default to thin */
            color: white;
        }

        #siri-container {
            width: 100vw;
            height: 300px;
        }

        #response-text {
            position: absolute;
            bottom: 20vh;
            font-size: 1.5rem;
            font-weight: 300; /* Thin font styling */
            text-align: center;
            max-width: 700px;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            padding: 0 20px;
            letter-spacing: -0.02em;
        }

        #response-text.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Seamless Hub Overlay Styles */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        /* Original, sleek tab styling */
        .hub-tab {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.35);
            cursor: pointer;
            padding: 8px 20px;
            transition: color 0.2s, border-bottom 0.2s;
            border-bottom: 2px solid transparent;
            font-weight: 400;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        
        .hub-tab.active {
            color: #ffffff;
            border-bottom: 2px solid #ffffff;
        }

        .hub-tab:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        /* Sleek scrollbars for lists */
        #history-container::-webkit-scrollbar,
        #passwords-list::-webkit-scrollbar,
        #reminders-list::-webkit-scrollbar {
            width: 4px;
        }
        #history-container::-webkit-scrollbar-thumb,
        #passwords-list::-webkit-scrollbar-thumb,
        #reminders-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    
    <!-- Seamless Hub Overlay Menu -->

        <div id="hub-wrapper" style="width: 100%; max-width: 650px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100%; box-sizing: border-box;">
            <!-- Tab Navigation Menu Header -->
            <div style="display: flex; gap: 15px; margin-bottom: 45px; justify-content: center; width: 100%;">
                <div id="tab-history" class="hub-tab active" onclick="switchHubTab('history')">History</div>
                <div id="tab-reminders" class="hub-tab" onclick="switchHubTab('reminders')">Reminders</div>

        // State Variables

        let lastFollowUp = null; // Tracks current follow-up context

        // Conversation history - Clears upon page refresh

        let siriWave;
        let currentAmplitude = 0.4; 
        let currentSpeed = 0.08;    

        // Smoothly animate the SiriWave with increased intensity parameters
        function animateWave() {
            let targetAmplitude = (isListeningState || isSpeaking) ? 2.2 : 0.4;
            let targetSpeed = (isListeningState || isSpeaking) ? 0.25 : 0.08;

            currentAmplitude += (targetAmplitude - currentAmplitude) * 0.1;
            currentSpeed += (targetSpeed - currentSpeed) * 0.1;

            if (siriWave) {
                siriWave.setAmplitude(currentAmplitude);
                siriWave.setSpeed(currentSpeed);
            }
            requestAnimationFrame(animateWave);
        }

        // --- SPEECH SYNTHESIS (VOICE) ---
        let availableVoices = [];
        window.speechSynthesis.onvoiceschanged = () => availableVoices = window.speechSynthesis.getVoices();

        function getBestVoice() {
            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
            
            // 1. Prioritise premium Australian English Online "Natural" voices (Your perfect voice profile)
            let auVoice = availableVoices.find(v => v.lang === 'en-AU' && v.name.includes('Natural')) || 
                          availableVoices.find(v => v.lang === 'en-AU' && v.name.includes('Online')) ||
                          availableVoices.find(v => v.lang === 'en-AU' && v.name.includes('Google')) ||
                          availableVoices.find(v => v.lang === 'en-AU');
            if (auVoice) return auVoice;

            // 2. Prioritise US English Online "Natural" voices (Explicitly avoid British UK en-GB)
            let usVoice = availableVoices.find(v => v.lang === 'en-US' && v.name.includes('Natural')) || 
                          availableVoices.find(v => v.lang === 'en-US' && v.name.includes('Online')) ||
                          availableVoices.find(v => v.lang === 'en-US' && v.name.includes('Google')) ||
                          availableVoices.find(v => v.lang === 'en-US');
            if (usVoice) return usVoice;

            // 3. Fallback: Any English accent EXCEPT British (en-GB)
            let nonBritishVoice = availableVoices.find(v => v.lang.startsWith('en') && !v.lang.includes('GB'));
            if (nonBritishVoice) return nonBritishVoice;

            return availableVoices[0];
        }

        function speak(text) {
            return new Promise((resolve) => {
                isSpeaking = true;
                
                // Keep record of conversation context
                if (text && text !== "Thinking..." && text !== "Cancelled.") {
                    const lastMsg = conversationHistory[conversationHistory.length - 1];
                    if (!lastMsg || lastMsg.text !== text || lastMsg.role !== 'model') {
                        conversationHistory.push({ role: 'model', text: text });
                    }
                }

                // Temporarily abort recognition so synthesis doesn't loop back into speech input
                try {
                    if (recognition) {
                        recognition.abort();
                    }
                } catch(e) {}

                responseText.textContent = text;
                responseText.classList.add('visible');

                // If response is too long, bypass TTS voice playback completely and show text
                if (text.length > 180) {
                    isSpeaking = false;
                    setTimeout(() => { if (!isSpeaking) responseText.classList.remove('visible'); }, 8000);
                    restartRecognition();
                    resolve();
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.voice = getBestVoice();
                utterance.pitch = 1.0;
                utterance.rate = 1.0; 

                // Failsafe timeout to prevent Chrome TTS engine locks
                const speakTimeout = setTimeout(() => {
                    console.log("Failsafe triggered: Speech Synthesis forced release.");
                    window.speechSynthesis.cancel();
                    isSpeaking = false;
                    restartRecognition();
                    resolve();
                }, 10000); 

                utterance.onend = () => {
                    clearTimeout(speakTimeout);
                    isSpeaking = false;
                    setTimeout(() => { if (!isSpeaking) responseText.classList.remove('visible'); }, 3000);
                    restartRecognition();
                    resolve();
                };

                utterance.onerror = () => { 
                    clearTimeout(speakTimeout);
                    isSpeaking = false; 
                    restartRecognition();
                    resolve(); 
                };
                
                window.speechSynthesis.speak(utterance);
            });
        }

        // Activates target listening state for interactive follow-up responses
        function triggerFollowUpListening() {
            setTimeout(() => {
                isListeningState = true;
                activationSound.currentTime = 0;
                activationSound.play().catch(e => console.log("Audio play blocked."));

                clearTimeout(idleTimeout);
                idleTimeout = setTimeout(() => {
                    isListeningState = false;
                    lastFollowUp = null; // Reset context on idle timeout
                }, 8000); 
            }, 300);
        }

        // --- SPOKEN WORDS TO MATH DIGITS CONVERTER ---
        function convertSpokenNumbers(text) {
            const units = {
                'zero': 0, 'one': 1, 'two': 2, 'three': 3, 'four': 4, 'five': 5, 'six': 6, 'seven': 7, 'eight': 8, 'nine': 9,
                'ten': 10, 'eleven': 11, 'twelve': 12, 'thirteen': 13, 'fourteen': 14, 'fifteen': 15, 'sixteen': 16,
                'seventeen': 17, 'eighteen': 18, 'nineteen': 19
            };
            const tens = {
                'twenty': 20, 'thirty': 30, 'forty': 40, 'fifty': 50, 'sixty': 60, 'seventy': 70, 'eighty': 80, 'ninety': 90
            };

            let result = text;
            
            for (let t in tens) {
                for (let u in units) {
                    if (u !== 'zero') {
                        const regex1 = new RegExp(`\\b${t}\\s+${u}\\b`, 'gi');
                        const regex2 = new RegExp(`\\b${t}-${u}\\b`, 'gi');
                        const mathSum = parseInt(tens[t]) + parseInt(units[u]);
                        result = result.replace(regex1, mathSum);
                        result = result.replace(regex2, mathSum);
                    }
                }
            }
            
            for (let t in tens) {
                const regex = new RegExp(`\\b${t}\\b`, 'gi');
                result = result.replace(regex, tens[t]);
            }
            
            for (let u in units) {
                const regex = new RegExp(`\\b${u}\\b`, 'gi');
                result = result.replace(regex, units[u]);
            }
            
            return result;
        }

        // Advanced local parser for reminders from long spoken strings
        function parseReminderCommand(commandText) {
            // strip wake words or prefixes
            let clean = commandText.replace(/^(please\s+)?(remind me to|set a reminder to|set a reminder for|schedule a reminder to|remind me for|reminder to|add a reminder to|add reminder to)\s+/i, '').trim();
            
            let timeStr = "";
            let task = clean;

            // Extract time patterns: "at 5:00 pm", "at 10 am", "at 3 o'clock", "at noon"
            const timeRegex = /(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i;
            const timeMatch = clean.match(timeRegex);
            if (timeMatch) {
                let hour = parseInt(timeMatch[1]);
                const min = timeMatch[2] ? parseInt(timeMatch[2]) : 0;
                const ampm = timeMatch[3].toLowerCase();
                if (ampm === 'pm' && hour < 12) hour += 12;
                if (ampm === 'am' && hour === 12) hour = 0;
                timeStr = `${hour.toString().padStart(2, '0')}:${min.toString().padStart(2, '0')}`;
                task = task.replace(timeMatch[0], '');
            } else {
                // Military style time check: "at 15:00"
                const milTimeRegex = /(?:at\s+)?([0-1]\d|2[0-3]):?([0-5]\d)\b/i;
                const milTimeMatch = clean.match(milTimeRegex);
                if (milTimeMatch) {
                    timeStr = `${milTimeMatch[1]}:${milTimeMatch[2]}`;
                    task = task.replace(milTimeMatch[0], '');
                }
            }

            const today = new Date();
            let targetDate = new Date();

            if (/\btomorrow\b/i.test(clean)) {
                targetDate.setDate(today.getDate() + 1);
                task = task.replace(/\btomorrow\b/i, '');
            } else if (/\btoday\b/i.test(clean)) {
                task = task.replace(/\btoday\b/i, '');
            } else {
                // Check relative weekdays
                const weekdays = { 'sunday': 0, 'monday': 1, 'tuesday': 2, 'wednesday': 3, 'thursday': 4, 'friday': 5, 'saturday': 6 };
                let weekdayFound = false;
                for (const [dayName, dayCode] of Object.entries(weekdays)) {
                    const dayRegex = new RegExp(`(?:next\\s+)?(?:on\\s+)?\\b${dayName}\\b`, 'i');
                    if (dayRegex.test(clean)) {
                        const currentDay = today.getDay();
                        let daysToAdd = dayCode - currentDay;
                        if (daysToAdd <= 0) daysToAdd += 7;
                        targetDate.setDate(today.getDate() + daysToAdd);
                        task = task.replace(dayRegex, '');
                        weekdayFound = true;
                        break;
                    }
                }

                if (!weekdayFound) {
                    // Specific calendar date matches
                    const months = ['january','february','march','april','may','june','july','august','september','october','november','december'];
                    for (let i = 0; i < months.length; i++) {
                        const monthName = months[i];
                        const monthRegex1 = new RegExp(`(?:on\\s+)?\\b${monthName}\\b\\s+(\\d{1,2})(?:st|nd|rd|th)?`, 'i');
                        const monthRegex2 = new RegExp(`(?:on\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?\\b${monthName}\\b`, 'i');
                        
                        let dateMatch = clean.match(monthRegex1);
                        if (dateMatch) {
                            targetDate.setMonth(i);
                            targetDate.setDate(parseInt(dateMatch[1]));
                            task = task.replace(dateMatch[0], '');
                            break;
                        }
                        dateMatch = clean.match(monthRegex2);
                        if (dateMatch) {
                            targetDate.setMonth(i);
                            targetDate.setDate(parseInt(dateMatch[1]));
                            task = task.replace(dateMatch[0], '');
                            break;
                        }
                    }
                }
            }

            // Clean syntax particles
            task = task.replace(/\b(on|at|for|to)\b/gi, '').replace(/\s+/g, ' ').trim();
            if (!timeStr) timeStr = "09:00";

            const [h, m] = timeStr.split(':');
            targetDate.setHours(parseInt(h), parseInt(m), 0, 0);

            return {
                task: task || "Generic Reminder",
                datetime: targetDate
            };
        }

        // Multi-tiered robust clipboard copier
        function copyToClipboard(button) {
            const text = button.getAttribute('data-password');
            if (!text) return;

            // Attempt 1: Modern Clipboard API
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showCopiedFeedback(button);
                }).catch(() => {
                    fallbackCopyToClipboard(button, text);
                });
            } else {
                fallbackCopyToClipboard(button, text);
            }
        }

        function fallbackCopyToClipboard(button, text) {
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                const successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                if (successful) {
                    showCopiedFeedback(button);
                } else {
                    console.error("Fallback execution copy was unsuccessful");
                }
            } catch (err) {
                console.error("Fallback execution copy failed:", err);
            }
        }

        // --- GEMINI REST API CLIENT (Remote Reasoner) ---
        async function callGemini(userPrompt) {
            if (!geminiApiKey) return null;

            // System instructions detailing PC operations tools for Gemini fallback execution
            const systemPrompt = `You are Gemini, acting as the advanced reasoning core for the Leo Desktop Assistant.
Your task is to analyze the user's input and choose the correct tool/action to perform on their PC.

AVAILABLE TOOLS & JSON SCHEMAS:
1. {"action": "speak", "param": "detailed text response"}
   Use this for answering general knowledge questions, solving complex calculations, conversing, translating languages, or telling jokes/facts.
2. {"action": "open_app", "app": "app_key_name", "speak": "spoken confirmation"}
   Launches a native PC application.
   Valid app_key_name options: steam, discord, vscode, spotify, epic games, calculator, clock, word, excel, powerpoint, whatsapp, telegram, zoom, slack, netflix, settings, paint, camera, maps, weather app, roblox, edge, mail, xbox, photos, onenote, github desktop.
3. {"action": "open_web", "site": "site_key_name_or_url", "speak": "spoken confirmation"}
   Opens a website in a new tab.
   Valid site_key_name options: youtube, twitter, instagram, github, reddit, tiktok. You can also supply any raw HTTPS URL (e.g. "https://news.google.com").
4. {"action": "google_search", "query": "search terms", "speak": "spoken confirmation"}
   Performs a Google Search on the web.
5. {"action": "youtube_play", "query": "video topic or title", "speak": "spoken confirmation"}
   Searches and plays a video directly on YouTube.
6. {"action": "email_draft", "recipient": "name_or_email", "subject": "subject line", "body": "email contents", "speak": "spoken confirmation"}
   Drafts a complete email using Outlook Web deep links.
7. {"action": "weather_check", "city": "city name", "speak": "spoken confirmation"}
   Queries meteorological data for any specified city.
8. {"action": "calendar_reminder", "task": "reminder description", "speak": "spoken confirmation"}
   Uses Google Calendar templating for a reminder event.
9. {"action": "roblox_launch", "game": "roblox game name", "speak": "spoken confirmation"}
   Launches experiences directly inside the Roblox app.

CRITICAL INSTRUCTIONS:
- You must respond ONLY with a raw JSON object matching one of the schemas above. 
- Do NOT wrap the JSON response in markdown code blocks (e.g., do not use \`\`\`json).
- Keep spoken text natural, brief, and designed for speech synthesis.`;

            // Transform conversation history array to Gemini SDK messages block format
            const contents = [];
            conversationHistory.forEach(item => {
                contents.push({
                    role: item.role === 'user' ? 'user' : 'model',
                    parts: [{ text: item.text }]
                });
            });

            if (contents.length === 0 || contents[contents.length - 1].role !== 'user') {
                contents.push({
                    role: 'user',
                    parts: [{ text: userPrompt }]
                });
            }

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${geminiApiKey}`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: contents,
                        systemInstruction: {
                            parts: [{ text: systemPrompt }]
                        },
                        generationConfig: {
                            responseMimeType: "application/json"
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`Gemini API Error: ${response.status}`);
                }

                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text.trim();
                
                let cleanedJson = jsonText;
                if (cleanedJson.startsWith("```json")) {
                    cleanedJson = cleanedJson.replace(/^```json/, "");
                }
                if (cleanedJson.endsWith("```")) {
                    cleanedJson = cleanedJson.slice(0, -3);
                }
                cleanedJson = cleanedJson.trim();

                return JSON.parse(cleanedJson);
            } catch (e) {
                console.error("Gemini API invocation failed:", e);
                return null;
            }
        }

        async function executeGeminiAction(result) {
            if (!result || !result.action) {
                await speak("I couldn't process that command.");
                return;
            }

            const speakText = result.speak || result.param || "";
            const action = result.action.toLowerCase();

            switch (action) {
                case 'speak':
                    const textToSay = result.param || result.text || result.speak || "";
                    if (textToSay) {
                        await speak(textToSay);
                    }
                    break;

                case 'open_app':
                    const app = (result.app || result.param || "").toLowerCase();
                    if (appProtocols[app]) {
                        if (speakText) await speak(speakText);
                        window.location.href = appProtocols[app];
                    } else {
                        await speak(`I don't know the app protocol for ${app}.`);
                    }
                    break;

                case 'open_web':
                    const site = (result.site || result.param || result.url || "");
                    const allowedWebsites = {
                        'youtube': 'https://www.youtube.com',
                        'twitter': 'https://www.twitter.com',
                        'instagram': 'https://www.instagram.com',
                        'github': 'https://www.github.com',
                        'reddit': 'https://www.reddit.com',
                        'tiktok': 'https://www.tiktok.com'

                            const rolimonsRes = await fetch('https://api.rolimons.com/games/v1/gamelist');
                            const rolimonsData = await rolimonsRes.json();

                            if (rolimonsData && rolimonsData.success && rolimonsData.games) {
                                for (const [placeId, gameInfo] of Object.entries(rolimonsData.games)) {
                                    const gameTitle = gameInfo[0].toLowerCase();
                                    if (gameTitle.includes(gameQuery) || gameQuery.includes(gameTitle)) {
                                        foundPlaceId = placeId;
                                        actualName = gameInfo[0];
                                        break;
                                    }
                                }
                            }

                            if (foundPlaceId) {
                                await speak(`Launching ${actualName} in Roblox!`);
                                window.location.href = `roblox://experiences/start?placeId=${foundPlaceId}`;
                                isListeningState = false;
                                return;
                            } else {
                                throw new Error("No dynamic ID found");
                            }
                        } catch (e) {
                            await speak(`I couldn't find the Roblox game ${gameQuery || 'requested'} in our database.`);
                        }
                    }
                } else if (isRobloxRequest && gameQuery.length === 0) {
                    await speak("Opening Roblox.");
                    window.location.href = "roblox://";
                    isListeningState = false;
                    return;
                }
            }
            
            // --- 18. OPEN APPS / ALLOWED WEBSITES (Supports Launching Multiple at Once) ---
            else if (command.includes('open') || command.includes('launch') || command.includes('go to')) {
                const allowedWebsites = {
                    'youtube': 'https://www.youtube.com',
                    'twitter': 'https://www.twitter.com',
                    'instagram': 'https://www.instagram.com',
                    'github': 'https://www.github.com',
                    'reddit': 'https://www.reddit.com',
                    'tiktok': 'https://www.tiktok.com'
                };

                let matchedApps = [];
                let matchedWebsites = [];

                // Find all matching native app keys inside the command
                for (const [appName, protocol] of Object.entries(appProtocols)) {
                    const regex = new RegExp(`\\b${appName}\\b`, 'i');
                    if (regex.test(command)) {
                        matchedApps.push({ name: appName, protocol: protocol });
                    }
                }

                // Find all matching websites inside the command
                for (const [siteName, url] of Object.entries(allowedWebsites)) {
                    const regex = new RegExp(`\\b${siteName}\\b`, 'i');
                    if (regex.test(command)) {
                        if (!matchedApps.some(app => app.name === siteName)) {
                            matchedWebsites.push({ name: siteName, url: url });
                        }
                    }
                }

                if (matchedApps.length > 0 || matchedWebsites.length > 0) {
                    const names = [...matchedApps.map(a => a.name), ...matchedWebsites.map(w => w.name)];
                    let listStr = "";
                    if (names.length === 1) {
                        listStr = names[0];
                    } else if (names.length === 2) {
                        listStr = `${names[0]} and ${names[1]}`;
                    } else {
                        listStr = names.slice(0, -1).join(', ') + `, and ${names[names.length - 1]}`;
                    }

                    await speak(`Opening ${listStr}.`);

                    // Execute all matched app launch protocols sequentially with delays to prevent blockages
                    matchedApps.forEach((app, idx) => {
                        setTimeout(() => {
                            window.location.href = app.protocol;
                        }, idx * 350);
                    });

                    // Launch all websites in new tabs
                    matchedWebsites.forEach((site) => {
                        window.open(site.url, '_blank');
                    });

                    isListeningState = false;
                    return;
                } else {
                    // Let Gemini handle it if nothing matched natively
                    if (geminiApiKey) {
                        await speak("Thinking...");
                        const geminiResult = await callGemini(command);
                        if (geminiResult) {
                            await executeGeminiAction(geminiResult);
                            isListeningState = false;
                            return;
                        }
                    }
                    await speak("I couldn't resolve that opening sequence command.");
                }
            }

            // --- 19. EMAIL DRAFTING WITH FULL CONTENT ---
            else if (/\b(?:email|draft|mail|compose|send an email)\b/i.test(command)) {
                let recipient = "";
                let subject = "New Draft";
                let body = "Hello there,\n\n";

                const emailRegex = /(?:draft an email|email|draft a mail) to\s+([a-zA-Z0-9@\.\s]+?)\s+(?:about|subject)\s+(.+?)\s+(?:saying|body|with)\s+(.+)/i;
                const match = command.match(emailRegex);

                if (match) {
                    recipient = match[1].trim();
                    subject = match[2].trim();
                    body = match[3].trim();
                    
                    const toField = recipient.includes('@') ? recipient : "";
                    const finalBody = recipient && !recipient.includes('@') 
                        ? `Hi ${recipient},\n\n${body}` 
                        : body;

                    await speak(`Opening Outlook to draft your email to ${recipient || 'someone'}.`);
                    window.open(`https://outlook.live.com/mail/0/deeplink/compose?to=${encodeURIComponent(toField)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(finalBody)}`, "_blank");
                } else {
                    const toMatch = command.match(/to\s+([a-zA-Z0-9@\.\s]+)/i);
                    if (toMatch) {
                        recipient = toMatch[1].split(' ')[0].trim();
                        currentEmailDraft.recipient = recipient;
                        await speak("What is the subject of the email?");
                        lastFollowUp = 'email_subject';
                        triggerFollowUpListening();
                    } else {
                        await speak("Who is the recipient of the email?");
                        lastFollowUp = 'email_recipient';
                        currentEmailDraft = { recipient: '', subject: '', body: '' };
                        triggerFollowUpListening();
                    }
                }
            }

            // --- 20. PERSONALITY / NAME CHATTER CONFIG ---
            else if (/who are you|what is your name/i.test(command)) {
                await speak(`I am ${assistantName}, your intelligent web-based companion.`);
            }

            // --- 21. COUPLING DISCONNECT FALLBACK (Remote API Reasoner) ---
            else {
                if (geminiApiKey) {
                    await speak("Thinking...");
                    const geminiResult = await callGemini(command);
                    if (geminiResult) {
                        await executeGeminiAction(geminiResult);
                        isListeningState = false;
                        return;
                    }
                }

                const sorryResponses = [
                    "Sorry, I didn't understand.",
                    "Sorry, I didn't quite get that."
                ];
                await speak(sorryResponses[Math.floor(Math.random() * sorryResponses.length)]);
            }

            isListeningState = false; 
        }

        // --- DYNAMIC WAKE WORD RESOLVERS ---
        function getDynamicWakeWords() {
            const name = assistantName.toLowerCase();
            return [
                `hey ${name}`, `ok ${name}`, `okay ${name}`, `hi ${name}`, `hello ${name}`, `yo ${name}`, `wake up ${name}`
            ];
        }

        function getDynamicWakeWordRegex() {
            const name = assistantName.toLowerCase();
            if (name === 'leo') {
                return /(?:hey|ay|hay|hi|gday|g'day|ok|okay|play|say|day)\s+(leo|lio|leeo|leow|liao|layo|neo|cleo|theo|layer|layout|low|law|lead|let|letter|leave|lake|leg|link|learn|look|loop|blue|glow|flow|line|light|list|left|lit|little|live|love|level|lion|liar|lear|learnt|clear|there|dear|darling|level|file|style|while|dial|mile|smile)|^(leo|lio|leeo|lear|clear)$/i;
            } else {
                const escapedName = name.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                return new RegExp(`(?:hey|ay|hay|hi|ok|okay|play|say|day|wake up|hello)\\s+(${escapedName})|^(${escapedName})$`, 'i');
            }
        }

        // --- SPEECH RECOGNITION (Always On) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        function restartRecognition() {
            if (isSpeaking) return; 
            try {
                recognition.start();
            } catch (e) {
                // Ignore if already running
            }
        }

        function initSpeechRecognition() {
            if (!SpeechRecognition) {
                responseText.textContent = "Voice recognition not supported. Use Chrome or Edge.";
                responseText.classList.add('visible');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false; 
            recognition.interimResults = true; 
            recognition.lang = 'en-AU'; 

            recognition.onstart = () => {
                recognitionActive = true;
            };

            recognition.onresult = (event) => {
                if (isSpeaking) return;

                if (document.getElementById('settings-modal').style.display === 'flex') {
                    return;
                }

                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }

                const currentText = (finalTranscript || interimTranscript).toLowerCase().trim();
                
                const directWakeWords = getDynamicWakeWords();
                const containsDirectWake = directWakeWords.some(phrase => currentText.includes(phrase));
                const wakeWordRegex = getDynamicWakeWordRegex();

                if ((containsDirectWake || wakeWordRegex.test(currentText)) && !isListeningState) {
                    isListeningState = true;
                    activationSound.currentTime = 0;
                    activationSound.play().catch(e => console.log("Audio requires interaction first time."));

                    clearTimeout(idleTimeout);
                    idleTimeout = setTimeout(() => {
                        isListeningState = false;
                        lastFollowUp = null;
                    }, 8000); 
                }

                if (finalTranscript) {
                    let commandText = finalTranscript.toLowerCase();
                    
                    for (const phrase of directWakeWords) {
                        if (commandText.includes(phrase)) {
                            commandText = commandText.replace(phrase, '').trim();
                        }
                    }

                    if (wakeWordRegex.test(commandText)) {
                        commandText = commandText.replace(wakeWordRegex, '').trim();
                    }

                    commandText = commandText.replace(/^[,.\s?]+|[,.\s?]+$/g, '').trim();

                    if (isListeningState) {
                        if (commandText.length > 2 && !['uh', 'um', 'ah'].includes(commandText)) {
                            isListeningState = false;
                            clearTimeout(idleTimeout);
                            
                            setTimeout(() => {
                                processCommand(commandText);
                            }, 400);
                        }
                    }
                }
            };

            recognition.onend = () => {
                recognitionActive = false;
                if (!isSpeaking) {
                    restartRecognition();
                }
            };

            setInterval(() => {
                if (!recognitionActive && !isSpeaking && micPermissionGranted) {
                    console.log("Watchdog Keep-Alive: Waking Speech Recognition up.");
                    restartRecognition();
                }
            }, 1500);

            restartRecognition();
        }

        window.addEventListener('keydown', (e) => {
            const isInputFocused = document.activeElement && 
                                  (document.activeElement.tagName === 'INPUT' || 
                                   document.activeElement.tagName === 'TEXTAREA' ||
                                   document.activeElement.isContentEditable);
            
            if (e.code === 'Space' && !isInputFocused) {
                e.preventDefault(); 
                toggleHub();
            }
            if (e.key === 'Escape') {
                closeSettings();
            }
        });

        function toggleHub() {
            const modal = document.getElementById('settings-modal');
            if (modal.style.display === 'flex') {
                closeSettings();
            } else {
                openSettings();
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop());
                micPermissionGranted = true;
            } catch (err) {
                responseText.textContent = "Please allow microphone access to use Leo!";
                responseText.classList.add('visible');
                return; 
            }

            siriWave = new SiriWave({
                container: siriContainer,
                width: window.innerWidth,
                height: 300,
                style: 'ios9',
                speed: currentSpeed,
                amplitude: currentAmplitude,
                autostart: true
            });

            window.addEventListener('resize', () => {
                siriContainer.innerHTML = ''; 
                siriWave = new SiriWave({
                    container: siriContainer,
                    width: window.innerWidth,
                    height: 300,
                    style: 'ios9',
                    speed: currentSpeed,
                    amplitude: currentAmplitude,
                    autostart: true
                });
            });

            animateWave();
            initSpeechRecognition();
        });

    </script>
