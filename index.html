<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guahh Assistant</title>
    
    <!-- Include Inter Tight Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Include the SiriWave Library -->
    <script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter Tight', sans-serif;
            color: white;
        }

        #siri-container {
            width: 100vw;
            height: 300px;
        }

        #response-text {
            position: absolute;
            bottom: 20vh;
            font-size: 1.5rem;
            font-weight: 400;
            text-align: center;
            max-width: 700px;
            line-height: 1.5;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: opacity 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            padding: 0 20px;
            letter-spacing: -0.02em;
        }

        #response-text.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body>
    
    <!-- SiriWave Library Target Container -->
    <div id="siri-container"></div>
    <div id="response-text"></div>

    <script>
        const siriContainer = document.getElementById('siri-container');
        const responseText = document.getElementById('response-text');
        const activationSound = new Audio('https://raw.githubusercontent.com/guahhinc/guahhai/main/jbl_begin_sae.mp3');

        // State Variables
        let isSpeaking = false;
        let isListeningState = false; 
        let idleTimeout = null;
        let micPermissionGranted = false;

        // SiriWave Variables
        let siriWave;
        let currentAmplitude = 0.3; // Increased idle amplitude
        let currentSpeed = 0.05;    // Increased idle speed

        // Smoothly animate the SiriWave
        function animateWave() {
            let targetAmplitude = (isListeningState || isSpeaking) ? 1.5 : 0.3;
            let targetSpeed = (isListeningState || isSpeaking) ? 0.15 : 0.06;

            currentAmplitude += (targetAmplitude - currentAmplitude) * 0.1;
            currentSpeed += (targetSpeed - currentSpeed) * 0.1;

            if (siriWave) {
                siriWave.setAmplitude(currentAmplitude);
                siriWave.setSpeed(currentSpeed);
            }
            requestAnimationFrame(animateWave);
        }

        // --- SPEECH SYNTHESIS (VOICE) ---
        let availableVoices = [];
        window.speechSynthesis.onvoiceschanged = () => availableVoices = window.speechSynthesis.getVoices();

        function getBestVoice() {
            if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
            let auVoice = availableVoices.find(v => v.lang === 'en-AU' && v.name.includes('Female')) || 
                          availableVoices.find(v => v.lang === 'en-AU');
            if (auVoice) return auVoice;

            const preferredNames = ['Aria', 'Jenny', 'Google UK English Female', 'Google US English', 'Samantha'];
            for (let name of preferredNames) {
                const found = availableVoices.find(v => v.name.includes(name));
                if (found) return found;
            }
            return availableVoices.find(v => v.lang.startsWith('en') && v.name.includes('Female')) || availableVoices[0];
        }

        function speak(text) {
            return new Promise((resolve) => {
                isSpeaking = true;
                responseText.textContent = text;
                responseText.classList.add('visible');

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.voice = getBestVoice();
                utterance.pitch = 1.0;
                utterance.rate = 1.05;

                utterance.onend = () => {
                    isSpeaking = false;
                    setTimeout(() => { if (!isSpeaking) responseText.classList.remove('visible'); }, 3000);
                    resolve();
                };

                utterance.onerror = () => { isSpeaking = false; resolve(); };
                window.speechSynthesis.speak(utterance);
            });
        }

        const appProtocols = {
            'steam': 'steam://open/main',
            'discord': 'discord://',
            'vs code': 'vscode://',
            'visual studio code': 'vscode://',
            'spotify': 'spotify://',
            'epic games': 'com.epicgames.launcher://',
            'calculator': 'ms-calculator:',
            'clock': 'ms-clock:',
            'word': 'ms-word:',
            'excel': 'ms-excel:',
            'powerpoint': 'ms-powerpoint:',
            'whatsapp': 'whatsapp://',
            'telegram': 'tg://',
            'zoom': 'zoommtg://',
            'slack': 'slack://',
            'netflix': 'netflix://',
            'file explorer': 'explorer:',
            'settings': 'ms-settings:',
            'paint': 'ms-paint:',
            'camera': 'microsoft.windows.camera:',
            'maps': 'bingmaps:',
            'weather app': 'bingweather:'
        };

        const backupJokes = [
            "Why do programmers prefer dark mode? Because light attracts bugs.",
            "I told my computer I needed a break, and now it won't stop sending me Kit-Kat ads.",
            "How many programmers does it take to change a light bulb? None, that's a hardware problem.",
            "Why did the web developer walk out of the restaurant? Because of the terrible table layout.",
            "What is a computer's favorite beat? An algo-rhythm!"
        ];

        // --- SMARTER BRAIN & COMMAND LOGIC ---
        async function processCommand(command) {
            // CANCEL COMMANDS (Do nothing and end listening state)
            const cancelWords = ['nothing', 'nevermind', 'never mind', 'cancel', 'stop', 'nvm', 'forget it'];
            if (cancelWords.includes(command)) {
                return; 
            }

            isListeningState = true; 

            // 1. CONVERSATION
            if (/^(yo|hello|hi|hey|gday|g'day)$/i.test(command)) {
                const greetings = ["G'day!", "Hi! How can I help you today?", "Hello there!", "Yo! What's up?"];
                await speak(greetings[Math.floor(Math.random() * greetings.length)]);
            }
            else if (command.includes('how are you') || command.includes("how's it going")) {
                await speak("I'm doing wonderfully, thanks for asking! I'm ready to assist you.");
            }
            else if (command.includes('what can you do') || command.includes('help me')) {
                await speak("I can open apps on your PC, calculate math, tell you the time, check the weather, play YouTube videos, and launch Roblox games.");
            }
            else if (command.includes('thank you') || command === 'thanks' || command === 'cheers') {
                await speak("You're very welcome! Let me know if you need anything else.");
            }

            // 2. JOKES & FACTS
            else if (command.includes('tell me a joke') || command.includes('make me laugh')) {
                try {
                    const res = await fetch('https://v2.jokeapi.dev/joke/Any?type=single');
                    const data = await res.json();
                    await speak(data.joke || backupJokes[Math.floor(Math.random() * backupJokes.length)]);
                } catch (e) {
                    await speak(backupJokes[Math.floor(Math.random() * backupJokes.length)]);
                }
            }

            // 3. YOUTUBE RANDOMIZER & AUTOPLAY (Uses DuckDuckGo "I'm Feeling Lucky" Trick)
            else if (command.includes('random youtube video') || command.includes('random video on youtube')) {
                await speak("Picking a fun random video for you!");
                const randomTopics = ["epic fails", "satisfying compilation", "mind blowing science", "funny animal moments", "best magic tricks"];
                const rq = randomTopics[Math.floor(Math.random() * randomTopics.length)];
                window.open(`https://duckduckgo.com/?q=!yt+${encodeURIComponent(rq)}`, '_blank');
            }
            else if (command.startsWith('play') && command.includes('on youtube')) {
                const query = command.replace('play', '').replace('on youtube', '').trim();
                await speak(`Playing ${query} on YouTube.`);
                // !yt automatically redirects to the first YouTube search result
                window.open(`https://duckduckgo.com/?q=!yt+${encodeURIComponent(query)}`, '_blank');
            }

            // 4. ROBLOX (Fixed Proxy Logic)
            else if (command.includes('in roblox')) {
                const match = command.match(/open (.+) in roblox/i);
                if (match) {
                    const gameName = match[1].trim();
                    await speak(`Searching Roblox for ${gameName}...`);
                    try {
                        // Fixed proxy using raw data to bypass the string wrapper issue
                        const url = `https://games.roblox.com/v1/games/list?keyword=${encodeURIComponent(gameName)}&maxRows=1`;
                        const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
                        const data = await res.json();
                        if (data && data.data && data.data.length > 0) {
                            await speak(`Launching ${data.data[0].name} in Roblox!`);
                            window.location.href = `roblox://experiences/start?placeId=${data.data[0].placeId}`;
                        } else throw new Error("Not found");
                    } catch (e) {
                        await speak(`I couldn't auto-launch ${gameName}. Opening the Roblox search page instead.`);
                        window.open(`https://www.roblox.com/discover/?Keyword=${encodeURIComponent(gameName)}`, '_blank');
                    }
                }
            }

            // 5. STRICT TIME & DATE PARSING (Ignores Math "times")
            else if (/(what time is it|current time|^time$|tell me the time)/i.test(command)) {
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                await speak(`The time is currently ${time}.`);
            } 
            else if (/(what date is it|what is the date|what day is it|^date$)/i.test(command)) {
                const date = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
                await speak(`Today is ${date}.`);
            }
            
            // 6. WEATHER
            else if (command.includes('weather')) {
                let city = "Melbourne"; 
                const match = command.match(/weather in ([a-zA-Z\s]+)/);
                if (match) city = match[1].trim();
                try {
                    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`);
                    const geoData = await geoRes.json();
                    if (!geoData.results) throw new Error("Not found");
                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geoData.results[0].latitude}&longitude=${geoData.results[0].longitude}&current_weather=true`);
                    const temp = (await weatherRes.json()).current_weather.temperature;
                    await speak(`It is ${temp} degrees in ${geoData.results[0].name}.`);
                } catch (e) {
                    await speak(`I couldn't fetch the weather for ${city}.`);
                }
            } 

            // 7. MATH & WIKIPEDIA
            else if (command.startsWith('what is') || command.startsWith('calculate') || command.startsWith('who is')) {
                let mathExpr = command.replace(/(what is|calculate)/g, '').replace(/plus/g, '+').replace(/minus/g, '-').replace(/times/g, '*').replace(/divided by/g, '/').replace(/x/g, '*').trim();
                
                // Strict Math Regex (Only numbers and operators)
                if (/^[\d\s\+\-\*\/\.\(\)]+$/.test(mathExpr) && /[0-9]/.test(mathExpr)) {
                    try {
                        const result = new Function('return ' + mathExpr)();
                        await speak(`The answer is ${result}.`);
                        isListeningState = false;
                        return;
                    } catch(e) {}
                }

                // If not math, search Wikipedia
                const query = command.replace(/what is |who is /g, '').trim();
                try {
                    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
                    const data = await res.json();
                    if (data.extract) {
                        const sentences = data.extract.split('. ');
                        const shortSummary = sentences[0] + (sentences[1] ? '. ' + sentences[1] + '.' : '.');
                        await speak(shortSummary);
                    } else {
                        await speak(`I'm not exactly sure about that.`);
                    }
                } catch (e) {
                    await speak(`I'm not exactly sure about that.`);
                }
            }
            
            // 8. OPEN APPS
            else if (command.includes('open') || command.includes('launch')) {
                let appFound = false;
                for (const [appName, protocol] of Object.entries(appProtocols)) {
                    if (command.includes(appName)) {
                        window.location.href = protocol;
                        await speak(`Opening ${appName}.`);
                        appFound = true;
                        break;
                    }
                }
                if (!appFound) {
                    const words = command.split(' ');
                    const openIndex = words.findIndex(w => w === 'open' || w === 'launch');
                    if (openIndex !== -1 && words[openIndex + 1]) {
                        const target = words.slice(openIndex + 1).join('').replace(/\s/g, '');
                        window.open(`https://www.${target}.com`, '_blank');
                        await speak(`Opening ${target} on the web.`);
                    }
                }
            }

            // 9. FALLBACK (If it didn't match any above commands, do nothing so it doesn't spam)
            else {
                // We don't speak here so it ignores random background noise beautifully
                console.log("Unrecognized command ignored: ", command);
            }

            isListeningState = false; 
        }

        // --- SPEECH RECOGNITION ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        function initSpeechRecognition() {
            if (!SpeechRecognition) {
                responseText.textContent = "Voice recognition not supported. Use Chrome or Edge.";
                responseText.classList.add('visible');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true; 
            recognition.lang = 'en-AU'; // Australian English

            recognition.onresult = (event) => {
                if (isSpeaking) return;

                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interimTranscript += event.results[i][0].transcript;
                }

                const currentText = (finalTranscript || interimTranscript).toLowerCase().trim();
                const wakeWordRegex = /hey\s+(guahh|gua|gwa|gwah|guwa|goo a|goya|guar|goa|car)/i;

                // WAKE WORD HEARD
                if (wakeWordRegex.test(currentText) && !isListeningState) {
                    isListeningState = true;
                    activationSound.currentTime = 0;
                    activationSound.play().catch(e => console.log("Audio requires interaction first time."));

                    clearTimeout(idleTimeout);
                    idleTimeout = setTimeout(() => {
                        isListeningState = false;
                    }, 8000); 
                }

                // PROCESS FINISHED SENTENCE
                if (finalTranscript) {
                    let commandText = finalTranscript.toLowerCase();
                    
                    if (wakeWordRegex.test(commandText)) {
                        commandText = commandText.replace(wakeWordRegex, '').trim();
                    }

                    if (isListeningState) {
                        // Filters out random 1-2 letter background noise entirely
                        if (commandText.length > 2 && !['uh', 'um', 'ah'].includes(commandText)) {
                            isListeningState = false;
                            clearTimeout(idleTimeout);
                            
                            // 0.4s Delay so it doesn't accidentally cut you off mid-breath
                            setTimeout(() => {
                                processCommand(commandText);
                            }, 400);
                        }
                    }
                }
            };

            recognition.onend = () => {
                if (!isSpeaking && micPermissionGranted) {
                    setTimeout(() => { try { recognition.start(); } catch(e) {} }, 500);
                } else if (micPermissionGranted) {
                    setTimeout(() => { try { recognition.start(); } catch(e) {} }, 1500);
                }
            };

            setTimeout(() => {
                try { recognition.start(); } catch(e) {}
            }, 500);
        }

        // --- AUTOMATIC INITIALIZATION (ON LOAD) ---
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                micPermissionGranted = true;
            } catch (err) {
                responseText.textContent = "Please allow microphone access to use Guahh!";
                responseText.classList.add('visible');
                return; 
            }

            siriWave = new SiriWave({
                container: siriContainer,
                width: window.innerWidth,
                height: 300,
                style: 'ios9',
                speed: currentSpeed,
                amplitude: currentAmplitude,
                autostart: true
            });

            window.addEventListener('resize', () => {
                siriContainer.innerHTML = ''; 
                siriWave = new SiriWave({
                    container: siriContainer,
                    width: window.innerWidth,
                    height: 300,
                    style: 'ios9',
                    speed: currentSpeed,
                    amplitude: currentAmplitude,
                    autostart: true
                });
            });

            animateWave();
            initSpeechRecognition();
        });

    </script>
</body>
</html>
